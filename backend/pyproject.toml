[project]
name = "pm-backend"
version = "0.1.0"
description = "FastAPI backend for the PM Kanban MVP"
requires-python = ">=3.12"
dependencies = [
  "bcrypt>=4.2.0",
  "fastapi>=0.115.6",
  "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27.0", "pytest>=8.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pm_backend"]

[tool.hatch.build.targets.wheel.force-include]
"pm_backend/seed" = "pm_backend/seed"
