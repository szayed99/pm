[project]
name = "pm-backend"
version = "0.1.0"
description = "FastAPI backend for the PM Kanban MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pm_backend"]
